<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - FraudShield</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #111827;
            --main-bg: #030712;
            --card-bg: rgba(31, 41, 55, 0.5);
            --border-color: rgba(55, 65, 81, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #e5e7eb;
            --accent-blue: #3b82f6;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            background-image: radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 30%),
                              radial-gradient(circle at bottom right, rgba(239, 68, 68, 0.15), transparent 40%);
            background-attachment: fixed;
        }
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 25px;
            height: 100vh;
            position: fixed;
            border-right: 1px solid var(--border-color);
            z-index: 10;
        }
        .sidebar h1 {
            font-size: 1.8em;
            font-weight: 700;
            margin: 0 0 40px 0;
            text-align: center;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
        }
        .sidebar ul li a.active, .sidebar ul li a:hover {
            background-color: var(--accent-blue);
            color: var(--text-primary);
        }
        .main-content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 40px;
        }
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; font-weight: 700; margin: 0; }
        .header p { color: var(--text-secondary); font-size: 1.1em; margin-top: 5px; }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }
        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            font-weight: 600;
        }
        .kpi-card .card-content h3 { font-size: 1.8em; margin: 0; }
        .kpi-card .card-content p { margin: 5px 0 0; color: var(--text-secondary); font-size: 0.9em; }

        .chart-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>FraudShield</h1>
        <ul>
            <li><a href="/"><span>Dashboard</span></a></li>
            <li><a href="/analytics.html" class="active"><span>Analytics</span></a></li>
            <li><a href="/settings.html"><span>Settings</span></a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>Analytics Deep Dive</h1>
            <p>Explore trends and patterns in suspicious activity.</p>
        </div>

        <div class="kpi-grid">
            <div class="card kpi-card">
                <div class="card-content">
                    <h3 id="top-attacker-ip">--</h3>
                    <p>Top Attacker IP</p>
                </div>
            </div>
            <div class="card kpi-card">
                <div class="card-content">
                    <h3 id="peak-fraud-time">--</h3>
                    <p>Peak Fraud Time</p>
                </div>
            </div>
            <div class="card kpi-card">
                <div class="card-content">
                    <h3 id="most-attacked-country">--</h3>
                    <p>Most Attacked Country</p>
                </div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="card">
                <h2>Suspicious Activity by Hour</h2>
                <canvas id="time-series-chart"></canvas>
            </div>
            <div class="card">
                <h2>Attacks by Country</h2>
                <canvas id="geo-breakdown-chart"></canvas>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/analytics_data')
                .then(response => response.json())
                .then(data => {
                    // Update KPIs
                    document.getElementById('top-attacker-ip').textContent = data.kpis.top_attacker_ip;
                    document.getElementById('peak-fraud-time').textContent = data.kpis.peak_fraud_time;
                    document.getElementById('most-attacked-country').textContent = data.kpis.most_attacked_country;

                    Chart.defaults.color = 'var(--text-primary)';
                    Chart.defaults.borderColor = 'var(--border-color)';

                    // Time Series Chart
                    const tsCtx = document.getElementById('time-series-chart').getContext('2d');
                    new Chart(tsCtx, {
                        type: 'bar',
                        data: {
                            labels: data.time_series.labels,
                            datasets: [{
                                label: 'Number of Suspicious Transactions',
                                data: data.time_series.data,
                                backgroundColor: 'rgba(59, 130, 246, 0.5)',
                                borderColor: 'rgba(59, 130, 246, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: { scales: { y: { beginAtZero: true } } }
                    });

                    // Geographic Breakdown Chart
                    const geoCtx = document.getElementById('geo-breakdown-chart').getContext('2d');
                    new Chart(geoCtx, {
                        type: 'doughnut',
                        data: {
                            labels: data.geo_breakdown.labels,
                            datasets: [{
                                label: 'Attacks by Country',
                                data: data.geo_breakdown.data,
                                backgroundColor: [
                                    'rgba(239, 68, 68, 0.7)', 'rgba(245, 158, 11, 0.7)',
                                    'rgba(16, 185, 129, 0.7)', 'rgba(59, 130, 246, 0.7)',
                                    'rgba(139, 92, 246, 0.7)',
                                ],
                                hoverOffset: 4
                            }]
                        }
                    });
                })
                .catch(error => console.error('Error fetching analytics data:', error));
        });
    </script>
</body>
</html>
