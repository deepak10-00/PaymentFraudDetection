<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - FraudShield</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --sidebar-bg: #1a222e;
            --main-bg: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #333;
            --text-secondary: #777;
            --accent-green: #2ecc71;
            --accent-orange: #f39c12;
            --accent-red: #e74c3c;
            --border-color: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-primary);
            margin: 0;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: #ecf0f1;
            padding: 20px;
            height: 100vh;
            position: fixed;
        }

        .sidebar h1 {
            font-size: 1.5em;
            margin: 10px 0 30px 0;
            text-align: center;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li a {
            display: block;
            color: #bdc3c7;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background-color 0.3s;
        }

        .sidebar ul li a.active, .sidebar ul li a:hover {
            background-color: #34495e;
            color: #fff;
        }

        .main-content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 40px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Explicitly two columns */
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
            padding: 25px;
            height: 380px; /* Slightly increased height for better chart rendering */
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #34495e;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Ensure canvas elements are responsive within their cards */
        .card canvas {
            max-width: 100%;
            height: 100%; /* Allow canvas to fill the fixed height of the card */
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .chart-grid {
                grid-template-columns: 1fr; /* Single column on smaller screens */
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>FraudShield</h1>
        <ul>
            <li><a href="/">Dashboard</a></li>
            <li><a href="/analytics" class="active">Analytics</a></li>
            <li><a href="/settings">Settings</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="chart-grid">
            <div class="card">
                <h2>Suspicious Transactions by Country</h2>
                <canvas id="countryChart"></canvas>
            </div>

            <div class="card">
                <h2>Suspicious Transactions by Payment Method</h2>
                <canvas id="paymentMethodChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Chart.js instances
            const countryCtx = document.getElementById('countryChart').getContext('2d');
            let countryChart = new Chart(countryCtx, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            const paymentMethodCtx = document.getElementById('paymentMethodChart').getContext('2d');
            let paymentMethodChart = new Chart(paymentMethodCtx, {
                type: 'pie',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                }
            });

            const fetchData = () => {
                fetch('/api/analytics_data')
                    .then(response => response.json())
                    .then(data => {
                        // Update Country Chart
                        countryChart.data.labels = data.country_chart.labels;
                        countryChart.data.datasets = data.country_chart.datasets;
                        countryChart.update();

                        // Update Payment Method Chart
                        paymentMethodChart.data.labels = data.payment_method_chart.labels;
                        paymentMethodChart.data.datasets = data.payment_method_chart.datasets;
                        paymentMethodChart.update();
                    })
                    .catch(error => {
                        console.error('Error fetching analytics data:', error);
                    });
            };

            // Fetch data immediately on page load
            fetchData();

            // Removed: setInterval(fetchData, 5000);
        });
    </script>

</body>
</html>
