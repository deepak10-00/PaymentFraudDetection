<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudShield Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #111827;
            --main-bg: #030712;
            --card-bg: rgba(31, 41, 55, 0.5);
            --border-color: rgba(55, 65, 81, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #e5e7eb;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        @keyframes count-up {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image: radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 30%),
                              radial-gradient(circle at bottom right, rgba(239, 68, 68, 0.15), transparent 40%);
            background-attachment: fixed;
        }

        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 25px;
            height: 100vh;
            position: fixed;
            border-right: 1px solid var(--border-color);
            z-index: 10;
        }

        .sidebar h1 {
            font-size: 1.8em;
            font-weight: 700;
            margin: 0 0 40px 0;
            text-align: center;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }

        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
        }

        .sidebar ul li a.active, .sidebar ul li a:hover {
            background-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .main-content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 40px;
        }
        
        .header {
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin: 0;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1.1em;
            margin-top: 5px;
        }

        .status-overlay {
            text-align: center;
            padding: 50px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .kpi-card { display: flex; align-items: center; }
        .kpi-card .icon {
            font-size: 2em;
            margin-right: 20px;
            padding: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-legit { background-color: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
        .icon-suspicious { background-color: rgba(245, 158, 11, 0.1); color: var(--accent-orange); }
        .icon-fraud { background-color: rgba(239, 68, 68, 0.1); color: var(--accent-red); }

        .card-content h3 { 
            margin: 0; 
            font-size: 2.2em; 
            font-weight: 700;
            animation: count-up 0.5s ease-out;
        }
        .card-content p { margin: 5px 0 0; color: var(--text-secondary); text-transform: uppercase; font-size: 0.9em; font-weight: 500; letter-spacing: 0.5px; }

        .chart-card h2, .table-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; text-transform: uppercase; font-size: 0.8em; color: var(--text-secondary); letter-spacing: 0.5px; }
        tbody tr { transition: background-color 0.2s; }
        tbody tr:hover { background-color: rgba(59, 130, 246, 0.1); }
        td { color: var(--text-primary); }
        .feature-list { font-family: monospace; font-size: 0.9em; color: var(--text-secondary); white-space: pre-wrap; max-height: 100px; overflow-y: auto; background: #111827; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>FraudShield</h1>
        <ul>
            <li><a href="/" class="active">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Dashboard</span>
            </a></li>
            <li><a href="/analytics.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                <span>Analytics</span>
            </a></li>
            <li><a href="/settings.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span>Settings</span>
            </a></li>
        </ul>
    </div>

    <div class="main-content" id="main-content">
        <div class="status-overlay" id="loading-state">
            <h2>Loading Dashboard Data...</h2>
            <p>Please wait a moment.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mainContent = document.getElementById('main-content');
            let chartInstance = null;

            const renderDashboard = () => `
                <div class="header">
                    <h1>Dashboard Overview</h1>
                    <p>Real-time analysis of transaction integrity.</p>
                </div>
                <div class="kpi-grid">
                    <div class="card kpi-card">
                        <div class="icon icon-legit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <div class="card-content">
                            <h3 id="total-legitimate">--</h3>
                            <p>Legitimate Transactions</p>
                        </div>
                    </div>
                    <div class="card kpi-card">
                        <div class="icon icon-suspicious">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        </div>
                        <div class="card-content">
                            <h3 id="total-suspicious">--</h3>
                            <p>Suspicious Transactions</p>
                        </div>
                    </div>
                    <div class="card kpi-card">
                        <div class="icon icon-fraud">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        </div>
                        <div class="card-content">
                            <h3 id="fraud-percentage">--</h3>
                            <p>Fraud Percentage</p>
                        </div>
                    </div>
                </div>
                <div class="card chart-card">
                    <h2>Transaction Analysis</h2>
                    <div class="chart-container">
                        <canvas id="transaction-chart"></canvas>
                    </div>
                </div>
                <div class="card table-card">
                    <h2>Honeypot Activity Logs</h2>
                    <table id="honeypot-logs-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Amount</th>
                                <th>Attacker IP</th>
                                <th>Attempted Actions</th>
                                <th>Scaled Features</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="card table-card">
                    <h2>Recent Legitimate Transactions</h2>
                    <table id="legitimate-transactions-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Amount</th>
                                <th>Risk Score</th>
                                <th>Scaled Features</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            `;

            const renderError = (error) => {
                mainContent.innerHTML = `
                    <div class="status-overlay">
                        <h2 style="color: var(--accent-red);">Failed to Load Dashboard</h2>
                        <p>There was an error fetching the data. Please check the console for details and ensure the server is running.</p>
                        <p style="font-family: monospace; color: var(--text-secondary); background: var(--main-bg); padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);">${error.message}</p>
                    </div>
                `;
            };

            const animateCountUp = (el, endValue, isPercentage = false) => {
                let start = 0;
                const duration = 1500;
                const end = parseFloat(endValue);
                if (!el || isNaN(end)) return;

                const step = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    let currentValue = progress * end;
                    if (isPercentage) {
                        el.textContent = currentValue.toFixed(2) + '%';
                    } else {
                        el.textContent = Math.floor(currentValue).toLocaleString();
                    }
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    }
                };
                window.requestAnimationFrame(step);
            };

            const updateKpis = (summary) => {
                animateCountUp(document.getElementById('total-legitimate'), summary.total_legitimate);
                animateCountUp(document.getElementById('total-suspicious'), summary.total_suspicious);
                animateCountUp(document.getElementById('fraud-percentage'), summary.fraud_percentage.replace('%', ''), true);
            };

            const formatFeatures = (features) => {
                if (typeof features === 'string') {
                    try { features = JSON.parse(features); } catch (e) { return features; }
                }
                return Object.entries(features)
                    .map(([key, value]) => `${key.padEnd(15, ' ')}: ${Number(value).toFixed(4)}`)
                    .join('\n');
            };

            const populateTable = (tableId, data, columns) => {
                const tableBody = document.querySelector(`${tableId} tbody`);
                if (!tableBody) return;
                tableBody.innerHTML = '';
                if (data.length === 0) {
                    const row = tableBody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = columns.length;
                    cell.textContent = 'No data available.';
                    cell.style.textAlign = 'center';
                    cell.style.padding = '20px';
                } else {
                    data.forEach(item => {
                        const row = tableBody.insertRow();
                        columns.forEach(col => {
                            const cell = row.insertCell();
                            let value = item[col.key];
                            if (col.formatter) value = col.formatter(value);
                            if (col.isHtml) cell.innerHTML = value; else cell.textContent = value;
                        });
                    });
                }
            };

            const renderChart = (honeypotLogs, legitimateTransactions) => {
                const ctx = document.getElementById('transaction-chart').getContext('2d');
                const allTransactions = [
                    ...honeypotLogs.map(t => ({ ...t, type: 'suspicious' })),
                    ...legitimateTransactions.map(t => ({ ...t, type: 'legitimate' }))
                ].sort((a, b) => a.Timestamp - b.Timestamp);

                if (chartInstance) chartInstance.destroy();
                
                Chart.defaults.borderColor = 'var(--border-color)';

                const createGradient = (r, g, b) => {
                    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                    gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.4)`);
                    gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                    return gradient;
                }

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: allTransactions.map(t => new Date(t.Timestamp).toLocaleTimeString()),
                        datasets: [
                            {
                                label: 'Suspicious Amount',
                                data: allTransactions.map(t => t.type === 'suspicious' ? t.Amount : NaN),
                                borderColor: 'var(--accent-orange)',
                                backgroundColor: createGradient(245, 158, 11),
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: 'var(--accent-orange)',
                                pointRadius: 4
                            },
                            {
                                label: 'Legitimate Amount',
                                data: allTransactions.map(t => t.type === 'legitimate' ? t.Amount : NaN),
                                borderColor: 'var(--accent-green)',
                                backgroundColor: createGradient(16, 185, 129),
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: 'var(--accent-green)',
                                pointRadius: 4
                            }
                        ]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { 
                            legend: { 
                                labels: { 
                                    color: '#e5e7eb' // Set legend font color
                                } 
                            } 
                        },
                        scales: { 
                            y: { 
                                beginAtZero: true, 
                                grid: { drawBorder: false },
                                ticks: { color: '#e5e7eb' } // Set Y-axis font color
                            },
                            x: { 
                                grid: { drawBorder: false },
                                ticks: { color: '#e5e7eb' } // Set X-axis font color
                            }
                        } 
                    }
                });
            };

            const fetchData = () => {
                fetch('/api/dashboard_data')
                    .then(response => {
                        if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                        return response.json();
                    })
                    .then(data => {
                        mainContent.innerHTML = renderDashboard();
                        updateKpis(data.summary);

                        const honeypotColumns = [
                            { key: 'Timestamp', formatter: val => new Date(val).toLocaleString() },
                            { key: 'Amount', formatter: val => `$${val.toFixed(2)}` },
                            { key: 'Attacker IP' },
                            { key: 'Attempted Actions' },
                            { key: 'Scaled Features', formatter: val => `<pre class="feature-list">${formatFeatures(val)}</pre>`, isHtml: true }
                        ];
                        populateTable('#honeypot-logs-table', data.honeypot_logs, honeypotColumns);

                        const legitimateColumns = [
                            { key: 'Timestamp', formatter: val => new Date(val).toLocaleString() },
                            { key: 'Amount', formatter: val => `$${val.toFixed(2)}` },
                            { key: 'Risk Score' },
                            { key: 'Scaled Features', formatter: val => `<pre class="feature-list">${formatFeatures(val)}</pre>`, isHtml: true }
                        ];
                        populateTable('#legitimate-transactions-table', data.legitimate_transactions, legitimateColumns);
                        
                        renderChart(data.honeypot_logs, data.legitimate_transactions);
                    })
                    .catch(error => {
                        console.error('Error fetching dashboard data:', error);
                        renderError(error);
                    });
            };

            fetchData();
        });
    </script>

</body>
</html>
