<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudShield Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <h1>FraudShield</h1>
        </div>
        <ul class="nav-menu">
            <li><a href="/" class="nav-item active">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Dashboard Overview</span>
            </a></li>
            <li><a href="/analytics.html" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                <span>Deep Analytics</span>
            </a></li>
            <li><a href="/checkout" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span>Payment Gateway Demo</span>
            </a></li>
        </ul>
    </div>

    <div class="main-wrapper">
        <nav class="top-navbar">
            <div class="page-title">
                <h2>Real-time Monitoring</h2>
                <p>Ensure network integrity across all transactions.</p>
            </div>
            <div class="user-controls">
                <div class="notification-bell">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <div class="notification-dot"></div>
                </div>
                <div class="user-profile">
                    <div class="user-info" style="text-align: right;">
                        <span class="user-name">Admin User</span>
                        <span class="user-role">Security Ops</span>
                    </div>
                    <div class="avatar">AU</div>
                </div>
            </div>
        </nav>

        <div class="content" id="main-content">
            <div class="status-overlay glass-panel animate-up" id="loading-state" style="padding: 50px; text-align: center;">
                <h2>Loading Dashboard Data...</h2>
                <p style="color: var(--text-secondary);">Connecting to API endpoints...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mainContent = document.getElementById('main-content');
            let chartInstance = null;

            window.switchTab = function(evt, tabId) {
                document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(tabId).style.display = 'block';
                evt.currentTarget.classList.add('active');
            };

            window.filterTable = function(tableId, query, searchColIndex) {
                const term = query.toLowerCase();
                const tbody = document.querySelector(`#${tableId} tbody`);
                if (!tbody) return;
                Array.from(tbody.rows).forEach(row => {
                    const cell = row.cells[searchColIndex];
                    if (cell) {
                        const txt = cell.textContent || cell.innerText;
                        row.style.display = txt.toLowerCase().indexOf(term) > -1 ? '' : 'none';
                    }
                });
            };

            const renderDashboard = () => `
                <div class="kpi-grid">
                    <div class="glass-panel kpi-card animate-up delay-1">
                        <div class="kpi-icon icon-legit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <div class="kpi-info">
                            <h3 id="total-legitimate">--</h3>
                            <p>Legitimate Txns</p>
                        </div>
                    </div>
                    <div class="glass-panel kpi-card animate-up delay-2">
                        <div class="kpi-icon icon-suspicious">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        </div>
                        <div class="kpi-info">
                            <h3 id="total-suspicious">--</h3>
                            <p>Blocked Attempts</p>
                        </div>
                    </div>
                    <div class="glass-panel kpi-card animate-up delay-3">
                        <div class="kpi-icon icon-fraud">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        </div>
                        <div class="kpi-info">
                            <h3 id="fraud-percentage">--</h3>
                            <p>System Anomaly Rate</p>
                        </div>
                    </div>
                </div>
                <div class="glass-panel chart-card animate-up delay-1">
                    <h2>Transaction Analysis</h2>
                    <div class="chart-container">
                        <canvas id="transaction-chart"></canvas>
                    </div>
                </div>
                <div class="tabs-container animate-up delay-2">
                    <div class="tabs-header glass-panel">
                        <button class="tab-btn active" onclick="switchTab(event, 'honeypot-tab')">Honeypot Interceptions</button>
                        <button class="tab-btn" onclick="switchTab(event, 'legit-tab')">Verified Transactions</button>
                        <button class="tab-btn" onclick="switchTab(event, 'failed-tab')">Failed Gateway Payments</button>
                    </div>
                </div>

                <div class="tab-content active glass-panel table-card animate-up delay-3" id="honeypot-tab">
                    <div class="card-header">
                        <h2>Honeypot Interceptions</h2>
                        <input type="text" class="search-input" placeholder="Search Attacker IP..." oninput="filterTable('honeypot-logs-table', this.value, 2)">
                    </div>
                    <div class="table-responsive">
                        <table id="honeypot-logs-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Amount</th>
                                    <th>Location</th>
                                    <th>Attacker IP</th>
                                    <th>Attempted Actions</th>
                                    <th>Scaled Features</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-content glass-panel table-card animate-up delay-3" id="legit-tab" style="display: none;">
                    <div class="card-header">
                        <h2>Recent Verified Transactions</h2>
                        <input type="text" class="search-input" placeholder="Search Transaction ID..." oninput="filterTable('legitimate-transactions-table', this.value, 1)">
                    </div>
                    <div class="table-responsive">
                        <table id="legitimate-transactions-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Amount</th>
                                    <th>Risk Score</th>
                                    <th>Location</th>
                                    <th>IP Address</th>
                                    <th>Scaled Features</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-content glass-panel table-card animate-up delay-3" id="failed-tab" style="display: none;">
                    <div class="card-header">
                        <h2>Gateway Failed Payments</h2>
                        <input type="text" class="search-input" placeholder="Search Order ID..." oninput="filterTable('failed-payments-table', this.value, 3)">
                    </div>
                    <div class="table-responsive">
                        <table id="failed-payments-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Amount</th>
                                    <th>Location</th>
                                    <th>IP Address</th>
                                    <th>Reason</th>
                                    <th>Razorpay Order ID</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            `;

            const renderError = (error) => {
                mainContent.innerHTML = `
                    <div class="status-overlay">
                        <h2 style="color: var(--accent-red);">Failed to Load Dashboard</h2>
                        <p>There was an error fetching the data. Please check the console for details and ensure the server is running.</p>
                        <p style="font-family: monospace; color: var(--text-secondary); background: var(--main-bg); padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);">${error.message}</p>
                    </div>
                `;
            };

            const animateCountUp = (el, endValue, isPercentage = false) => {
                let start = 0;
                const duration = 1500;
                const end = parseFloat(endValue);
                if (!el || isNaN(end)) return;

                const step = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    let currentValue = progress * end;
                    if (isPercentage) {
                        el.textContent = currentValue.toFixed(2) + '%';
                    } else {
                        el.textContent = Math.floor(currentValue).toLocaleString();
                    }
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    }
                };
                window.requestAnimationFrame(step);
            };

            const updateKpis = (summary) => {
                animateCountUp(document.getElementById('total-legitimate'), summary.total_legitimate);
                animateCountUp(document.getElementById('total-suspicious'), summary.total_suspicious);
                animateCountUp(document.getElementById('fraud-percentage'), summary.fraud_percentage.replace('%', ''), true);
            };

            const formatFeatures = (features) => {
                if (!features) return 'N/A';
                if (typeof features === 'string') {
                    try { features = JSON.parse(features); } catch (e) { return features; }
                }
                try {
                    return Object.entries(features)
                        .map(([key, value]) => `${key.padEnd(15, ' ')}: ${Number(value).toFixed(4)}`)
                        .join('\n');
                } catch (e) {
                    return 'Error parsing features';
                }
            };

            const populateTable = (tableId, data, columns, highlightFirst = false) => {
                const tableBody = document.querySelector(`${tableId} tbody`);
                if (!tableBody) return;
                tableBody.innerHTML = '';
                if (data.length === 0) {
                    const row = tableBody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = columns.length;
                    cell.textContent = 'No data available.';
                    cell.style.textAlign = 'center';
                    cell.style.padding = '20px';
                } else {
                    data.forEach(item => {
                        const row = tableBody.insertRow();
                        columns.forEach(col => {
                            const cell = row.insertCell();
                            let value = item[col.key];
                            if (col.formatter) value = col.formatter(value, item);
                            if (col.isHtml) cell.innerHTML = value; else cell.textContent = value;
                        });
                    });
                }
            };

            const renderChart = (honeypotLogs, legitimateTransactions) => {
                const ctx = document.getElementById('transaction-chart').getContext('2d');
                const allTransactions = [
                    ...honeypotLogs.filter(t => t.Timestamp && t.Timestamp !== "N/A").map(t => ({ ...t, type: 'suspicious' })),
                    ...legitimateTransactions.filter(t => t.Timestamp && t.Timestamp !== "N/A").map(t => ({ ...t, type: 'legitimate' }))
                ].sort((a, b) => new Date(a.Timestamp) - new Date(b.Timestamp));

                if (chartInstance) chartInstance.destroy();
                
                Chart.defaults.borderColor = 'var(--border-color)';

                const createGradient = (r, g, b) => {
                    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
                    gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.4)`);
                    gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                    return gradient;
                }

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: allTransactions.map(t => new Date(t.Timestamp).toLocaleTimeString()),
                        datasets: [
                            {
                                label: 'Suspicious Amount',
                                data: allTransactions.map(t => t.type === 'suspicious' ? t.Amount : NaN),
                                borderColor: 'var(--accent-orange)',
                                backgroundColor: createGradient(245, 158, 11),
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: 'var(--accent-orange)',
                                pointBorderColor: 'var(--bg-color)',
                                pointRadius: 4,
                                pointHoverRadius: 6
                            },
                            {
                                label: 'Legitimate Amount ($)',
                                data: allTransactions.map(t => t.type === 'legitimate' ? t.Amount : NaN),
                                borderColor: 'var(--accent-green)',
                                backgroundColor: createGradient(16, 185, 129),
                                fill: true,
                                tension: 0.4,
                                pointBackgroundColor: 'var(--accent-green)',
                                pointBorderColor: 'var(--bg-color)',
                                pointRadius: 4,
                                pointHoverRadius: 6
                            }
                        ]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { 
                            legend: { 
                                labels: { 
                                    color: '#e5e7eb' // Set legend font color
                                } 
                            } 
                        },
                        scales: { 
                            y: { 
                                beginAtZero: true, 
                                grid: { drawBorder: false },
                                ticks: { color: '#e5e7eb' } // Set Y-axis font color
                            },
                            x: { 
                                grid: { drawBorder: false },
                                ticks: { color: '#e5e7eb' } // Set X-axis font color
                            }
                        } 
                    }
                });
            };

            // Render HTML structure once
            mainContent.innerHTML = renderDashboard();

            const fetchData = () => {
                fetch('/api/dashboard_data')
                    .then(response => {
                        if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                        return response.json();
                    })
                    .then(data => {
                        updateKpis(data.summary);

                        const formatLocation = item => {
                            const entries = [item.City, item.State, item.Country].filter(v => v && v !== 'N/A');
                            return entries.length > 0 ? entries.join(', ') : 'N/A';
                        };

                        const honeypotColumns = [
                            { key: 'Timestamp', formatter: val => { const d = new Date(val); return isNaN(d.getTime()) ? '<span class="date-cell">N/A</span>' : `<span class="date-cell">${d.toLocaleString()}</span>`; }, isHtml: true },
                            { key: 'Amount', formatter: val => `<span class="amount">$${val.toFixed(2)}</span>`, isHtml: true },
                            { key: 'Location', formatter: (val, item) => `<span class="location-cell">${formatLocation(item)}</span>`, isHtml: true },
                            { key: 'Attacker IP', formatter: val => `<span class="tx-id">${val}</span>`, isHtml: true },
                            { key: 'Attempted Actions', formatter: val => val ? val : '<span class="badge warning">Unknown</span>', isHtml: true },
                            { key: 'Scaled Features', formatter: val => `<div class="feature-list">${formatFeatures(val)}</div>`, isHtml: true }
                        ];
                        populateTable('#honeypot-logs-table', data.honeypot_logs, honeypotColumns);

                        const legitimateColumns = [
                            { key: 'Timestamp', formatter: val => { const d = new Date(val); return isNaN(d.getTime()) ? '<span class="date-cell">N/A</span>' : `<span class="date-cell">${d.toLocaleString()}</span>`; }, isHtml: true },
                            { key: 'Amount', formatter: val => `<span class="amount">$${val.toFixed(2)}</span>`, isHtml: true },
                            { key: 'Risk Score', formatter: val => val < 0.3 ? `<span class="badge success">Safe (${val})</span>` : `<span class="badge warning">Check (${val})</span>`, isHtml: true },
                            { key: 'Location', formatter: (val, item) => `<span class="location-cell">${formatLocation(item)}</span>`, isHtml: true },
                            { key: 'IP Address', formatter: val => `<span class="tx-id">${val || 'N/A'}</span>`, isHtml: true },
                            { key: 'Scaled Features', formatter: val => `<div class="feature-list">${formatFeatures(val)}</div>`, isHtml: true }
                        ];
                        populateTable('#legitimate-transactions-table', data.legitimate_transactions, legitimateColumns);
                        
                        const failedColumns = [
                            { key: 'LoggedAt', formatter: val => { const d = new Date(val); return isNaN(d.getTime()) ? '<span class="date-cell">N/A</span>' : `<span class="date-cell">${d.toLocaleString()}</span>`; }, isHtml: true },
                            { key: 'transaction', formatter: val => `<span class="amount">$${val && val.Amount ? parseFloat(val.Amount).toFixed(2) : '0.00'}</span>`, isHtml: true },
                            { key: 'Location', formatter: (val, item) => `<span class="location-cell">${formatLocation(item)}</span>`, isHtml: true },
                            { key: 'ip_address', formatter: val => `<span class="tx-id">${val || 'N/A'}</span>`, isHtml: true },
                            { key: 'error_details', formatter: val => val && val.description ? `<span class="badge danger">${val.description}</span>` : '<span class="badge warning">Unknown</span>', isHtml: true },
                            { key: 'order_id', formatter: val => `<span class="tx-id">${val || 'N/A'}</span>`, isHtml: true }
                        ];
                        populateTable('#failed-payments-table', data.failed_payments || [], failedColumns);

                        renderChart(data.honeypot_logs, data.legitimate_transactions);


                    })
                    .catch(error => {
                        console.error('Error fetching dashboard data:', error);
                        renderError(error);
                    });
            };

            fetchData();
            
            // Auto-refresh the dashboard data silently every 3 seconds
            // setInterval(fetchData, 3000);
        });
    </script>

</body>
</html>
